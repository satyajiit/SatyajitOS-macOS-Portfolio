    <!-- Apply the saved appearance before first paint so there is no flash. -->
    <script>
      try {
        var saved = JSON.parse(localStorage.getItem('satyajitos:appearance') || 'null')
        var mode = saved && saved.mode
        var dark = mode ? mode === 'dark' : true
        if (mode === 'auto') dark = matchMedia('(prefers-color-scheme: dark)').matches
        document.documentElement.dataset.appearance = dark ? 'dark' : 'light'
        if (saved && saved.accent && saved.accent !== 'blue')
          document.documentElement.dataset.accent = saved.accent
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <noscript>SatyajitOS needs JavaScript to boot. It is, after all, an operating system.</noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
